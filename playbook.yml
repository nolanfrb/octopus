---
- name: Apply the base configuration to every managed host
  hosts: all
  gather_facts: true
  roles:
    - base

- name: Provision the Redis vote queue
  hosts: redis
  gather_facts: false
  roles:
    - redis

- name: Provision the PostgreSQL vote store
  hosts: postgresql
  gather_facts: false
  roles:
    - postgresql

- name: Deploy the poll web client
  hosts: poll
  gather_facts: false
  roles:
    - poll

- name: Deploy the vote worker
  hosts: worker
  gather_facts: false
  roles:
    - worker

- name: Deploy the result web client
  hosts: result
  gather_facts: false
  roles:
    - result
