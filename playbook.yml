---
- name: Apply the base configuration to every managed host
  hosts: all
  become: true
  gather_facts: true
  roles:
    - base
  tags: base

- name: Provision the Redis vote queue
  hosts: redis
  become: true
  gather_facts: false
  roles:
    - redis
  tags: redis

- name: Provision the PostgreSQL vote store
  hosts: postgresql
  become: true
  gather_facts: false
  roles:
    - postgresql
  tags: postgresql

- name: Deploy the poll web client
  hosts: poll
  become: true
  gather_facts: false
  roles:
    - poll
  tags: poll

- name: Deploy the vote worker
  hosts: worker
  become: true
  gather_facts: false
  roles:
    - worker
  tags: worker

- name: Deploy the result web client
  hosts: result
  become: true
  gather_facts: false
  roles:
    - result
  tags: result
