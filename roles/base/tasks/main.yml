---
- name: Ensure the shared Ansible remote_tmp base exists
  ansible.builtin.file:
    path: /tmp/.ansible/tmp
    state: directory
    owner: root
    group: root
    mode: '01777'

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name: '{{ base_packages }}'
    state: present
